<!-- pagina expecifica de cadastro, com campos para email/telefone, senha e confirmação de senha. Contém links para cadastrar-se e para entrar caso já tenha cadastro. -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | LAUDO</title>
  <link rel="stylesheet" href="sytleentCadastro.css">
</head>
<body>

  <main class="container-login">
    <div class="card-login">
      
      <!-- BOTÃO VOLTAR -->
      <a href="index.html" class="btn-voltar">← Voltar para o início</a>

      <!-- CABEÇALHO DO CARD -->
      <div class="header-login">
        <h1 class="logo">LAUDO</h1>
        <h2>Acesse sua conta</h2>
        <p>Informe seus dados de acesso para continuar</p>
      </div>

      <!-- FORMULÁRIO -->
      <form action="ProjetoPSTC.html" method="post" class="form-login">
        
        <div class="form-group">
          <label for="usuario">E-mail ou Telefone</label>
          <input 
            type="text" 
            id="usuario" 
            name="usuario" 
            placeholder="seuemail@exemplo.com ou (19) 99999-9999" 
            required
          >
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input 
            type="password" 
            id="senha" 
            name="senha" 
            placeholder="••••••••" 
            required
          >
        </div>

        <!-- BOTÃO PRINCIPAL -->
        <button type="submit" class="btn-entrar-acao">Finalizar Entrada</button>
      </form>

      <!-- RODAPÉ DO CARD / CADASTRO -->
      <div class="footer-login">
        <p>Ainda não tem uma conta?</p>
        <a href="Cadastro.html" class="btn-cadastrar">Cadastre-se</a>
      </div>

    </div>
  </main>

</body>
</html>
