<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição Profissional</title>
    <link rel="stylesheet" href="stylesprofissional.css">
</head>
<body>

    <div class="quadrado">
        <h1>Se inscreva como profissional</h1>

        <div class="campos">
            <!-- Coluna da Esquerda (com Descrição do serviço) -->
            <div class="coluna">
                Nome completo<br>
                <input type="text"><br>

                Gênero<br>
                <input type="text"><br>

                E-mail<br>
                <input type="text"><br>

                CPF<br>
                <input type="number"><br>

                Descrição do serviço<br>
                <input type="text"><br>
            </div>

            <!-- Coluna da Direita -->
            <div class="coluna">
                Telefone<br>
                <input type="text"><br>

                Profissão a exercer<br>
                <input type="text"><br>

                Margem preço p/ contratação<br>
                <input type="number"><br>

                Endereço<br>
                <input type="text"><br>
            </div>
        </div>

        <a href="ProjetoPSTC.html">Finalizar inscrição</a>
    </div>

</body>
</html>
