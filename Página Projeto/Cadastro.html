<!-- essa é uma pagina que tem como objetivo cadastrar o usuario no site, para que ele possa ter acesso a todas as funcionalidades do mesmo.
ela possui campos para o usuario inserir seu email ou telefone, senha e confirmação de senha, alem de um botão para realizar o cadastro e um link para entrar caso ja tenha cadastro.
caso algo seja modificado, acrescente o que foi alterado no final do arquivo, para que seja possivel identificar o que foi modificado. -->


<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastre-se | LAUDO</title>
  <link rel="stylesheet" href="styleCadastro.css">
</head>
<body>

  <main class="container-cadastro">
    <div class="card-cadastro">
      
      <!-- BOTÃO VOLTAR -->
      <a href="ProjetoPSTC.html" class="btn-voltar">← Voltar para o início</a>

      <!-- CABEÇALHO DO CARD -->
      <div class="header-cadastro">
        <h1 class="logo">LAUDO</h1>
        <h2>Crie sua conta</h2>
        <p>Preencha os campos abaixo para começar a usar a plataforma</p>
      </div>

      <!-- FORMULÁRIO -->
      <form action="index.html" method="post" class="form-cadastro">
        
        <div class="form-group">
          <label for="usuario">E-mail ou Telefone</label>
          <input 
            type="text" 
            id="usuario" 
            name="usuario" 
            placeholder="seuemail@exemplo.com ou (19) 99999-9999" 
            required
          >
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input 
            type="password" 
            id="senha" 
            name="senha" 
            placeholder="••••••••" 
            required
          >
        </div>

        <div class="form-group">
          <label for="confirma-senha">Confirme a senha</label>
          <input 
            type="password" 
            id="confirma-senha" 
            name="confirma-senha" 
            placeholder="••••••••" 
            required
          >
        </div>

        <!-- BOTÃO PRINCIPAL -->
        <button type="submit" class="btn-cadastrar">Cadastrar-se</button>
      </form>

      <!-- RODAPÉ DO CARD / LOGIN -->
      <div class="footer-cadastro">
        <p>Já tem uma conta?</p>
        <a href="entrarCadastro.html" class="btn-entrar">Entrar</a>
      </div>

    </div>
  </main>

</body>
</html>
