<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscrição Profissional | LAUDO</title>
  <link rel="stylesheet" href="stylesprofissional.css">
</head>
<body>

  <main class="container-inscricao">
    <div class="card-inscricao">
      
      <!-- BOTÃO VOLTAR -->
      <a href="index.html" class="btn-voltar">← Voltar para o início</a>

      <!-- CABEÇALHO DO CARD -->
      <div class="header-inscricao">
        <h1 class="logo">LAUDO</h1>
        <h2>Seja um Profissional Parceiro</h2>
        <p>Preencha seus dados para divulgar seus serviços na plataforma</p>
      </div>

      <!-- FORMULÁRIO DE INSCRIÇÃO (Redireciona para index.html ao finalizar) -->
      <form action="index.html" method="get" class="form-inscricao">
        
        <div class="form-grid">
          
          <!-- COLUNA 1 -->
          <div class="form-group">
            <label for="nome">Nome completo</label>
            <input 
              type="text" 
              id="nome" 
              name="nome" 
              placeholder="Seu nome completo" 
              required
            >
          </div>

          <div class="form-group">
            <label for="email">E-mail</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              placeholder="seuemail@exemplo.com" 
              required
            >
          </div>

          <div class="form-group">
            <label for="telefone">Telefone / WhatsApp</label>
            <input 
              type="tel" 
              id="telefone" 
              name="telefone" 
              placeholder="(19) 99999-9999" 
              required
            >
          </div>

          <div class="form-group">
            <label for="cpf">CPF</label>
            <input 
              type="text" 
              id="cpf" 
              name="cpf" 
              placeholder="000.000.000-00" 
              required
            >
          </div>

          <!-- COLUNA 2 -->
          <div class="form-group">
            <label for="genero">Gênero</label>
            <select id="genero" name="genero" required>
              <option value="" disabled selected>Selecione...</option>
              <option value="masculino">Masculino</option>
              <option value="feminino">Feminino</option>
              <option value="outro">Outro</option>
              <option value="nao-informar">Preferir não informar</option>
            </select>
          </div>

          <div class="form-group">
            <label for="profissao">Profissão a exercer</label>
            <input 
              type="text" 
              id="profissao" 
              name="profissao" 
              placeholder="Ex: Eletricista, Encanador..." 
              required
            >
          </div>

          <div class="form-group">
            <label for="preco">Preço médio / Orçamento (R$)</label>
            <input 
              type="text" 
              id="preco" 
              name="preco" 
              placeholder="Ex: R$ 150,00 por serviço"
            >
          </div>

          <div class="form-group">
            <label for="endereco">Endereço / Cidade</label>
            <input 
              type="text" 
              id="endereco" 
              name="endereco" 
              placeholder="Cidade, Bairro, UF" 
              required
            >
          </div>

          <!-- CAMPO OCUPANDO LARGURA TOTAL -->
          <div class="form-group full-width">
            <label for="descricao">Descrição do serviço</label>
            <textarea 
              id="descricao" 
              name="descricao" 
              rows="4" 
              placeholder="Descreva suas principais habilidades, especialidades e experiência profissional..." 
              required
            ></textarea>
          </div>

        </div>

        <!-- BOTÃO FINALIZAR -->
        <button type="submit" class="btn-finalizar">Finalizar Inscrição</button>

      </form>

    </div>
  </main>

</body>
</html>
